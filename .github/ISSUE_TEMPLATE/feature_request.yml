name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [Limitations](https://github.com/likehopper/thunderbird-gmail-labels#limitations) first:
        the extension only uses standard permissions, so some requests cannot be done.
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The need comes first, the solution after.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
